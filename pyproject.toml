[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norvara-oligo-stats"
version = "1.0.0rc1"
description = "PCR primer and oligonucleotide analysis with no third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
maintainers = [
    { name = "Norvara Therapeutics", email = "research@norvaratx.com" },
]
keywords = ["bioinformatics", "pcr", "primer", "oligonucleotide", "melting-temperature", "thermodynamics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Norvara-Therapeutics/oligo-stats"
Repository = "https://github.com/Norvara-Therapeutics/oligo-stats.git"
Issues = "https://github.com/Norvara-Therapeutics/oligo-stats/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
oligo-stats = "oligo_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
